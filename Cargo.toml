[package]
name = "emoji-sentiment"
version = "0.1.2"
edition = "2024"
authors = ["Wan, Jiun-Wei <wei840222@gmail.com>"]
description = "A fast CLI tool for analyzing emoji usage, sentiment scores, and sentiment intensity in text files or stdin"
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0"
repository = "https://github.com/wei840222/emo"
keywords = ["emoji", "sentiment", "cli", "unicode", "text-analysis"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
colored = "3.0"
anyhow = "1.0"
unicode-width = "0.2"
charabia = { version = "0.9", default-features = false, features = ["chinese-segmentation", "japanese-segmentation-ipadic", "korean"] }

[[bin]]
name = "emo"
path = "src/main.rs"
