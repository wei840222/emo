[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-sentiment"
version = "0.0.6"
description = "A Python package for emoji sentiment analysis."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICE.md"]
authors = [
    { name = "Wan, Jiun-Wei", email = "wei840222@gmail.com" },
]
keywords = ["emoji", "sentiment-analysis", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "emoji-data-python>=1.6.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
demo = [
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "streamlit>=1.59.2",
]

[project.urls]
Homepage = "https://github.com/wei840222/emoji-sentiment"
Repository = "https://github.com/wei840222/emoji-sentiment"
Issues = "https://github.com/wei840222/emoji-sentiment/issues"

[dependency-groups]
dev = [
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "twine>=6.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emoji_sentiment = ["data/*.csv"]
